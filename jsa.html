<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Top Services - JSA & Work Order Form</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    margin: 0;
    padding: 0;
    color: #222;
  }

  header {
    background: #1e8d54;
    color: white;
    text-align: center;
    padding: 20px 10px;
  }

  main {
    max-width: 900px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  h2 {
    color: #1e8d54;
    margin-bottom: 10px;
    border-bottom: 2px solid #1e8d54;
    padding-bottom: 5px;
  }

  form {
    margin-bottom: 40px;
  }

  label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
  }

  input, select, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  textarea {
    resize: vertical;
  }

  .form-section {
    margin-bottom: 30px;
  }

  .button {
    background: #1e8d54;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
  }

  .button:hover {
    background: #ea2801;
  }

  footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 10px;
  }
 nav {
      background: #222;
      color: white;
      display: flex;
      justify-content: center;
      padding: 15px 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      color: #00aaff;
    }
</style>

<header>
  <h1>Fulton Technologies</h1>
  <p>Job Safety Analysis (JSA)</p>
  <nav>
    <a href="workOrder.html">Work Order</a>
    <a href="index.html">Homepage</a>
    <a href="ntp.html">Notice-To-Proceed</a>
    <a href="safetyCheckList.html">Daily Safety Check List</a>
  </nav>
</header>
</head>
<body>



<main>
  <!-- JSA FORM -->
  <section>
    <h2>Job Safety Analysis (JSA) Form</h2>
    <form id="jsaForm">
      <div class="form-section">
        <label for="date">Date</label>
        <input type="date" id="date" name="date">

        <label for="location">Job Location</label>
        <input type="text" id="location" name="location" placeholder="Tower site, city, or coordinates">

        <label for="supervisor">Supervisor Name</label>
        <input type="text" id="supervisor" name="supervisor">

        <label for="crew">Crew Members</label>
        <textarea id="crew" name="crew" rows="3" placeholder="List all crew members"></textarea>
      </div>

      <div class="form-section">
        <label for="task">Task Description</label>
        <textarea id="task" name="task" rows="3" placeholder="Tower Sight Photos,  Identify unused or abandon equiptment, Inspect all equipment is install properly following all guidlines"></textarea>

        <label for="hazards">Identified Hazards</label>
        <textarea id="hazards" name="hazards" rows="3" placeholder="Slips & Trips , fall risk, RF exposure, weather"></textarea>

        <label for="controls">Safety Controls</label>
        <textarea id="controls" name="control4701 James p cole blvd Flint Mi 48505s" rows="3" placeholder="Identify hazard areas place cones if needed, rf monitor, keep work area clean, gloves and proper ppe"></textarea>
      </div>

      <div class="form-section">
        <label for="ppe">Required PPE</label>
        <textarea id="ppe" name="ppe" rows="2" placeholder="Hard hat, harness, gloves, safety glasses, Boots, Y-Lanyards"></textarea>

        <label for="signoff">Crew Sign-off</label>
        <textarea id="signoff" name="signoff" rows="2" placeholder="Each member acknowledges JSA briefing"></textarea>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center;">
        <input id="jsaSaveName" type="text" placeholder="Save as (optional)" style="flex:1;min-width:200px;padding:8px;border-radius:6px;border:1px solid #ccc;">
        <button id="jsaSaveBtn" type="button" class="button">Save JSA</button>
        <button type="button" class="button" onclick="window.print()">Print JSA Form</button>
      </div>
    </form>
  </section>

  <section style="margin-top:22px;">
    <h2>Saved JSAs</h2>
    <div id="savedJsaList">No saved JSAs.</div>
  </section>

  <!-- Simple modal for viewing saved JSA -->
  <div id="jsaViewModal" style="display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;">
    <div style="background:white;max-width:900px;margin:auto;padding:20px;border-radius:8px;max-height:90vh;overflow:auto;">
      <button id="jsaCloseModal" style="float:right;margin-bottom:10px;">Close</button>
      <pre id="jsaModalContent" style="white-space:pre-wrap;word-wrap:break-word;"></pre>
    </div>
  </div>


</main>

<footer>
  © 2026 Fulton Technologies Inc | fultontech@outlook.com
</footer>

<script src="jsa.js"></script>

</body>
</html>
