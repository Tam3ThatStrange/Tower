<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Top Services - Work Order Form</title>
<style>


    section {
      padding: 20px 20px;
      max-width: 1000px;
      margin: auto;
    }
  nav {
      background: #222;
      color: white;
      display: flex;
      justify-content: center;
      padding: 15px 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      color: #00aaff;
    }

  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    color: #222;
  }

  header {
    background: #004466;
    color: white;
    text-align: center;
    padding: 20px 10px;
  }

  main {
    max-width: 900px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  h2 {
    color: #004466;
    margin-bottom: 10px;
    border-bottom: 2px solid #00aaff;
    padding-bottom: 5px;
  }

  label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
  }

  input, select, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  textarea { resize: vertical; }

  .button {
    background: #004466;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    margin-top: 20px;
  }

  .button:hover { background: #0077b6; }

  footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>Fulton Technologies</h1>
  <p>Work Order Form</p>
<nav>
  <a href="jsa.html">JSA_Form</a>
  <a href="index.html">Homepage</a>
    <a href="ntp.html">Notice-To-Proceed</a>
    <a href="safetyCheckList.html">Daily Safety Check List</a>
</nav>
</header>

<main>
  <h2>Work Order Details</h2>
  <form id="workOrderForm">
    <label>Work Order Number</label>
    <input id="woNumber" type="text" placeholder="WO-0001">

    <label>Carrier</label>
    <select id="carrier">
      <option value="">Select Carrier</option>
      <option value="T-Mobile">T-Mobile</option>
      <option value="Verizon">Verizon</option>
      <option value="AT&T">AT&T</option>
      <option value="Other">Other</option>
    </select>

    <label>Site Name / ID</label>
    <input id="siteName" type="text" placeholder="Example: MI1234 / Grand Rapids Tower">

    <label>Scope of Work</label>
    <textarea id="scope" rows="3" placeholder="Decome old, unsed euiptment, and lines, disasemblt cabnits"></textarea>

    <label>Materials Used</label>
    <textarea id="materials" rows="2" placeholder="Trash bags"></textarea>

    <label>Completion Notes</label>
    <textarea id="completionNotes" rows="3" placeholder="Removed "></textarea>

    <label>Lead Technician</label>
    <input id="leadTech" type="text">

    <label>Signature</label>
    <input id="signature" type="text" placeholder="Type name for digital signature">

    <label>Date Completed</label>
    <input id="dateCompleted" type="date">

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center;">
      <input id="saveName" type="text" placeholder="Save as (optional)" style="flex:1;min-width:200px;padding:8px;border-radius:6px;border:1px solid #ccc;">
      <button id="saveBtn" type="button" class="button">Save Work Order</button>
      <button type="button" class="button" onclick="window.print()">Print Work Order</button>
    </div>

  </form>

  <section style="margin-top:22px;">
    <h2>Saved Work Orders</h2>
    <div id="savedList">No saved work orders.</div>
  </section>

  <!-- Simple modal for viewing saved data -->
  <div id="viewModal" style="display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;">
    <div style="background:white;max-width:900px;margin:auto;padding:20px;border-radius:8px;max-height:90vh;overflow:auto;">
      <button id="closeModal" style="float:right;margin-bottom:10px;">Close</button>
      <pre id="modalContent" style="white-space:pre-wrap;word-wrap:break-word;"></pre>
    </div>
  </div>
</main>

<footer>
  © 2025 Tower Top Services | info@towertopservices.com
</footer>

</footer>

<script src="workOrder.js"></script>
</body>
</html>
