<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal Login - Tower Top Services</title>

    <style>
        
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #f4f4f4 0%, #e0e9f0 100%);
        }

        .login-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-header h1 {
            color: #003a57;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .brand-header p {
            color: #666;
            font-size: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .back-to-home {
            display: inline-block;
            margin-top: 20px;
            color: #0077b6;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-to-home:hover {
            text-decoration: underline;
        }

        footer {
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        .login-section {
	padding: 30px 20px;
	max-width: 420px;
	margin: 20px auto;
}

.login-container {
	background: #ffffff;
	padding: 24px;
	border-radius: 10px;
	box-shadow: 0 6px 18px rgba(0,0,0,0.08);
	border: 1px solid rgba(0,0,0,0.04);
}

.login-container h2 {
	margin-bottom: 16px;
	color: #003a57;
	font-size: 1.25rem;
	text-align: left;
}

.form-row {
	margin-bottom: 12px;
	display: flex;
	flex-direction: column;
}

.form-row label {
	margin-bottom: 6px;
	font-size: 0.95rem;
	color: #223344;
}

.form-row input[type="text"],
.form-row input[type="password"] {
	padding: 10px 12px;
	border-radius: 6px;
	border: 1px solid #d0d7de;
	font-size: 1rem;
}

.form-row input:focus {
	outline: 3px solid rgba(0,170,255,0.12);
	border-color: #00aaff;
}

.form-row--actions {
	display: flex;
	justify-content: space-between;
	align-items: center;
}

.checkbox {
	display: inline-flex;
	align-items: center;
	gap: 8px;
	font-size: 0.95rem;
}

.link-small {
	font-size: 0.9rem;
	color: #0077b6;
	text-decoration: none;
}

.login-error {
	color: #b00020;
	background: #fff1f2;
	border: 1px solid rgba(176,0,32,0.12);
	padding: 8px 10px;
	border-radius: 6px;
	margin-bottom: 12px;
	display: none;
}

.btn-primary {
	background: #0077b6;
	color: white;
	border: none;
	padding: 10px 14px;
	border-radius: 6px;
	cursor: pointer;
	font-weight: 600;
}

.btn-secondary {
	display: inline-block;
	margin-left: 10px;
	padding: 10px 12px;
	border-radius: 6px;
	border: 1px solid #d0d7de;
	text-decoration: none;
	color: #223344;
}


    section {
      padding: 20px 20px;
      max-width: 1000px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #004466;
    }

@media (max-width: 520px) {
	.login-section { padding: 20px 12px; }
	.login-container { padding: 18px; }
}


    </style>
</head>
<body>
    <main class="login-page">
        <div class="login-container">
            <div class="brand-header">
                <h1>Fulton technologies </h1>
                <p>Employee Portal Login</p>
            </div>
            <form id="login-form" novalidate>
                <div class="form-row">
                    <label for="username">Email or Username</label>
                    <input id="username" name="username" type="text" 
                           autocomplete="username" required 
                           aria-required="true">
                </div>

                <div class="form-row">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" 
                           autocomplete="current-password" required 
                           aria-required="true">
                </div>

                <div class="form-row form-row--actions">
                    <label class="checkbox">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a class="link-small" href="#">Forgot password?</a>
                </div>

                <div id="login-error" class="login-error" aria-live="polite"></div>

                <div class="form-row">
                    <button type="submit" class="btn-primary">Sign in</button>
                    <a class="btn-secondary" href="workOrder.html">Work Orders</a>
                </div>
            </form>
            <a href="index.html" class="back-to-home">← Back to Homepage</a>
        </div>
    </main>

    <footer>
        <p>© 2025 Fulton Tech  | All Rights Reserved</p>
    </footer>

    <script src="login.js" defer></script>
</body>
</html>
